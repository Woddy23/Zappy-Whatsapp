<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mensagens — WhatsApp na ficha</title><link rel="stylesheet" href="settings.css"></head>
<body><main>
  <header class="page-header">
    <div><h1>Mensagens do WhatsApp</h1><p>O seu salão e as mensagens que usa na ficha do cliente.</p></div>
    <div class="save"><button type="submit" form="settings-form" id="save" disabled>Guardar alterações</button><span id="status" role="status" aria-live="polite">A carregar…</span></div>
  </header>
  <form id="settings-form" novalidate>
    <fieldset id="editor" disabled>
      <section class="business" aria-labelledby="business-heading">
        <h2 id="business-heading">Salão</h2>
        <div class="business-fields">
          <div><label for="business">Nome do salão</label><input id="business" name="business" maxlength="100" autocomplete="off" placeholder="Nome do seu salão"></div>
          <div><label for="app-url">Link da app</label><input id="app-url" name="appUrl" type="url" placeholder="https://…" maxlength="2000" autocomplete="off" spellcheck="false" aria-describedby="app-url-hint"><p id="app-url-hint" class="hint">Link de instalação enviado aos clientes.</p></div>
        </div>
      </section>
      <section class="messages" aria-labelledby="messages-heading">
        <div class="section-heading"><h2 id="messages-heading">Mensagens</h2></div>
        <div class="message-switcher"><label for="message-picker" class="sr-only">Mensagem a editar</label><select id="message-picker" name="message-picker" aria-controls="templates"></select><button id="add" type="button" class="secondary">Adicionar mensagem</button></div>
        <div id="templates"></div>
        <div id="undo-bar" hidden><span id="undo-note" role="status"></span><button id="undo" type="button" class="secondary">Desfazer</button></div>
      </section>
    </fieldset>
  </form>
  <button id="reload" type="button" class="secondary" hidden>Recarregar definições</button>
  <button id="reset" type="button" class="delete" hidden>Repor mensagens iniciais</button>
  <footer class="foot">Definições guardadas neste navegador. O envio é manual, pela conta iniciada no WhatsApp, para o número da ficha.</footer>
</main><script src="settings.js"></script></body></html>
